<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAK's Power Zone — Secure Owner</title><style>body{margin:0;background:#071323;color:#eef7ff;font:16px system-ui,sans-serif}main{max-width:850px;margin:40px auto;padding:20px}h1{color:#39b9ff}section{border:1px solid #29405b;background:#101f34;padding:22px;border-radius:16px;margin:20px 0}label{display:block;margin:14px 0}input,textarea{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #42607c;border-radius:8px;background:#071323;color:white}button{background:#39b9ff;color:#001321;border:0;border-radius:9px;padding:12px;margin:5px 5px 5px 0;font-weight:700}button:disabled{opacity:.5}a{color:#39b9ff}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #29405b;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hint{color:#a9bdd3}#status{min-height:22px}</style></head><body><main><a href="./">← Back to shop</a><h1>🔐 Secure owner dashboard</h1><p id="status" role="status">Loading Firebase…</p><section id="login"><h2>Owner sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><button id="reset">Forgot password?</button></section><section id="dashboard" class="hidden"><p>Signed in as <strong id="identity"></strong> <button id="logout">Log out</button></p><h2>Store products & repairs</h2><p class="hint">Changes are saved to Firestore and published to the shop automatically.</p><form id="productForm"><input id="pid" type="hidden"><label>Product / service name<input id="pname" required maxlength="120"></label><label>Category<input id="pcat" required maxlength="80"></label><label>Price (MVR)<input id="pprice" type="number" min="0" step="0.01" required></label><label>Stock (use 1 for service enquiries)<input id="pstock" type="number" min="0" step="1" required></label><label>Description<textarea id="pdesc" maxlength="600"></textarea></label><label>Emoji<input id="pemoji" maxlength="12" placeholder="📱"></label><button type="submit">Save item</button><button type="button" id="clear">New item</button></form><h2>Manage listings</h2><div id="items"></div></section></main><script type="module" src="./admin.js"></script></body></html>
